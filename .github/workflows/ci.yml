name: TeamForge CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and API tests
        run: pytest -q tests

      - name: Algorithm quality gate
        run: python -m bench.benchmark

      - name: Start TeamForge API
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: End-to-end Selenium tests
        env:
          BASE_URL: http://localhost:8000
        run: pytest -m e2e -q

  build:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t teamforge:${{ github.sha }} .