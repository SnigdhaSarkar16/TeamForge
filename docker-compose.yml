services:

  db:
    image: postgres:16
    container_name: teamforge-db
    environment:
      POSTGRES_DB: teamforge
      POSTGRES_USER: teamforge
      POSTGRES_PASSWORD: teamforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamforge -d teamforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: teamforge-api
    environment:
      DATABASE_URL: postgresql+psycopg2://teamforge:teamforge@db:5432/teamforge
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: teamforge-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    container_name: teamforge-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data: